name: AX5-JDCloud-OpenClash

on:
  workflow_dispatch:
  push:
    branches:
      - ax5-jdcloud-openclash
    paths:
      - configs/AX5-JDCloud.config
      - configs/General.config
      - scripts/Roc-script.sh
      - .github/workflows/AX5-JDCloud-OpenClash.yml
      - .github/workflows/Build-OpenWrt.yml

permissions:
  contents: write
  actions: write

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/openwrt-6.x.git
      repo_branch: main-nss
      config_file: configs/AX5-JDCloud.config
      firmware_tag: AX5-JDCloud-OpenClash
      kernel_file: kernel-6.12
      artifact_prefix: AX5-JDCloud-OpenClash
      manifest_file: libwrt-qualcommax-ipq60xx-redmi_ax5-jdcloud.manifest
      release_summary: >-
        Redmi AX5 JDCloud 专用精简固件，Linux 6.12、Firewall4、NSS、LuCI 中文界面和 OpenClash；仅构建 redmi,ax5-jdcloud，未包含 PassWall 或无关服务。
